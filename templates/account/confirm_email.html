{% load static %}
{% load i18n %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Your Email | FWL</title>
    
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- FWL Styles -->
    <link rel="stylesheet" href="{% static 'css/variables.css' %}">
    <link rel="stylesheet" href="{% static 'css/base.css' %}">
    <link rel="stylesheet" href="{% static 'css/hero.css' %}">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        .confirm-bg {
            background-image: url("{% static 'images/bg1.webp' %}");
            background-size: cover;
            background-position: center;
            min-height: 100vh;
            margin: 0;
            padding: 0;
        }
    </style>
</head>
<body class="confirm-bg">
    <div style="position: fixed; inset: 0; background: rgba(0,0,0,0.79); z-index: 0;"></div>
    <div style="position: relative; z-index: 1; display: flex; justify-content: center; align-items: center; min-height: 100vh; text-align: center; color: white; padding: 2rem;">
        <div>
            <img src="{% static 'images/fwlLogo.png' %}" alt="FWL Logo" style="height: 100px;" class="mb-4">
            <h1 style="color: rgb(214, 203, 222);" class="mb-4">Confirm Your Email Address</h1>
            <p class="fs-5">Thank you for signing up to FWL!</p>
            <p>Please confirm your email address by clicking the button below.</p>
            <form method="POST">
                {% csrf_token %}
                <button type="submit" style="background-color: rgb(121, 110, 40); color: white; border: none; border-radius: 10px; padding: 12px 24px; margin-top: 1rem; cursor: pointer;">
                    Confirm Email
                </button>
            </form>
            <a href="/" style="display: inline-block; margin-top: 1rem; background-color: rgb(214, 203, 222); color: rgb(121, 110, 40); border-radius: 10px; padding: 12px 24px; text-decoration: none;">
                Back to Home
            </a>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
